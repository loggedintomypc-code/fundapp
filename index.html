</style></head><body><script>(function(){var shown=0;function show(m){if(shown||window.__ok)return;shown=1;var a=document.getElementById("app");if(a)a.innerHTML='<div style="padding:20px;font:14px system-ui"><b>⚠️ অ্যাপ চালু হয়নি</b><p style="color:#b91c1c;word-break:break-all">'+m+'</p><p>ইন্টারনেট চেক করুন, তারপর অ্যাপ বন্ধ করে আবার খুলুন। না হলে এই লাল লেখাটির ছবি তুলে পাঠান।</p></div>'}
addEventListener("error",function(e){var t=e.target;if(t&&t.tagName=="SCRIPT")show("ফাইল লোড হয়নি: "+(t.src||"module"));else if(e.message)show(e.message)},true);
setTimeout(function(){show("৮ সেকেন্ডেও চালু হয়নি (ইন্টারনেট বা config.js সমস্যা হতে পারে)")},8000)})();</script>
<div id="app"><p style="text-align:center;padding:40px">⏳ লোড হচ্ছে…</p></div><input type="file" id="fi" hidden><div id="toast"></div>
<script type="module">
import{initializeApp,deleteApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword,updatePassword,reauthenticateWithCredential,EmailAuthProvider}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{initializeFirestore,persistentLocalCache,collection,doc,getDoc,setDoc,deleteDoc,onSnapshot,query,where,writeBatch}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import*as C from"./config.js";const cfg=C.cfg; // Firebase সেটিং config.js ফাইলে থাকে
const ADMINS=C.admins||["mamun@fund.app"],SHEET=C.sheetUrl||"";
const app=initializeApp(cfg),auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache()});
const MN=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
const $=s=>document.querySelector(s),f=n=>Number(n||0).toLocaleString("bn-BD"),sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const ymOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),dayOf=d=>ymOf(d)+"-"+String(d.getDate()).padStart(2,"0");let nowYM=ymOf(new Date()),today=dayOf(new Date());
const lab=y=>MN[+y.slice(5)-1]+" "+(+y.slice(0,4)).toLocaleString("bn-BD",{useGrouping:false});
const nx=y=>{let[a,b]=y.split("-").map(Number);b++;if(b>12){b=1;a++}return a+"-"+String(b).padStart(2,"0")};
const S={user:null,admin:false,members:[],tx:[],common:[],sum:null,tab:"home",err:"",ready:false,fl:{m:"",y:nowYM.slice(0,4),mo:"",t:"",q:""}};

const rateAt=(m,y)=>{let r=m.rate0;[...(m.changes||[])].sort((a,b)=>a.from<b.from?-1:1).forEach(c=>{if(c.from<=y)r=c.rate});return r};
function ledger(m){
  const pays=S.tx.filter(t=>t.kind=="pay"&&t.memberId==m.id),wv=S.tx.filter(t=>t.kind=="waiver"&&t.memberId==m.id),gw=new Set(S.common.filter(c=>c.kind=="gwaiver").map(c=>c.ym));
  let last=nowYM;pays.forEach(p=>{if(p.ym>last)last=p.ym});
  let bal=sum(pays.filter(p=>p.ym<m.join),"amount");const rows=[];
  for(let y=m.join;y<=last;y=nx(y)){
    const w=sum(wv.filter(x=>x.ym==y),"amount"),due=gw.has(y)?0:Math.max(0,rateAt(m,y)-w),paid=sum(pays.filter(p=>p.ym==y),"amount");
    bal+=paid-due;rows.push({ym:y,due,paid,bal,w,gw:gw.has(y)})}
  return{rows,bal}}

// ---------- online data (Firebase) ----------
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),clean=s=>(s||"").trim().toLowerCase().replace(/[^a-z0-9_.-]/g,""),email=i=>i+"@fund.app";
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800)};
const put=(c,o)=>{setDoc(doc(db,c,o.id),o).catch(e=>alert("সংরক্ষণ হয়নি: "+e.message));toast("✓ সংরক্ষিত")};
const rm=(c,id)=>{deleteDoc(doc(db,c,id)).catch(e=>alert(e.message));toast("মোছা হয়েছে")};
let unsub=[];const clear=()=>{unsub.forEach(u=>u());unsub=[]};
const watch=(q_,key)=>unsub.push(onSnapshot(q_,s=>{S[key]=s.docs.map(d=>({id:d.id,...d.data()}));if(key=="members")S.ready=true;render()},e=>{S.err=e.message;render()}));
const startAuth=()=>onAuthStateChanged(auth,async u=>{
  clear();S.user=u;S.err="";S.ready=false;S.members=[];S.tx=[];S.common=[];S.sum=null;S.tab="home";S.fl={m:"",y:nowYM.slice(0,4),mo:"",t:"",q:""};if(!u){render();return}
  S.admin=ADMINS.includes(u.email);
  if(S.admin){watch(collection(db,"members"),"members");watch(collection(db,"tx"),"tx");watch(collection(db,"common"),"common")}
  else{try{const ud=await getDoc(doc(db,"users",u.uid));if(!ud.exists()){S.err="এই আইডি কোনো সদস্যের সাথে যুক্ত নয়";S.ready=true;render();return}
    const mid=ud.data().memberId;
    unsub.push(onSnapshot(doc(db,"members",mid),d=>{S.members=[{id:d.id,...d.data()}];S.ready=true;render()},e=>{S.err=e.message;render()}));
    watch(query(collection(db,"tx"),where("memberId","==",mid)),"tx");
    let cA=[],cB=[];const mc=()=>{S.common=[...cA,...cB];render()},er=e=>{S.err=e.message;render()},mp=s=>s.docs.map(d=>({id:d.id,...d.data()}));
    unsub.push(onSnapshot(query(collection(db,"common"),where("kind","==","gwaiver")),s=>{cA=mp(s);mc()},er));
    unsub.push(onSnapshot(query(collection(db,"common"),where("memberId","==",mid)),s=>{cB=mp(s);mc()},er));
    unsub.push(onSnapshot(doc(db,"summary","group"),d=>{S.sum=d.data();render()}))}catch(e){S.err="লোড হয়নি — ইন্টারনেট চেক করুন";S.ready=true;render()}}
  render()});
function stat(m){const L=ledger(m),pays=S.tx.filter(t=>t.kind=="pay"&&t.memberId==m.id),pool=sum(pays,"amount"),dueNow=sum(L.rows.filter(r=>r.ym<=nowYM),"due"),net=pool-dueNow;
  return{net,pool,dueNow,adv:sum(pays.filter(p=>p.ym>nowYM),"amount"),label:net<0?"বকেয়া":net>0?"অগ্রিম":"পরিষ্কার"}}
function summary(){
  const pays=S.tx.filter(t=>t.kind=="pay"),pay=sum(pays,"amount"),exs=S.common.filter(c=>c.kind=="extra"),ex=sum(exs,"amount"),exO=sum(exs.filter(c=>c.src=="outsider"),"amount"),out=sum(S.common.filter(c=>c.kind=="expense"),"amount");
  return{balance:pay+ex-out,totalIn:pay+ex,totalOut:out,monthly:pay,extra:ex,extraO:exO,extraM:ex-exO,members:S.members.length,thisMonth:sum(pays.filter(p=>p.ym==nowYM),"amount"),due:S.members.reduce((a,m)=>a+Math.max(0,-stat(m).net),0)}}
let lastSum="";setInterval(()=>{if(!S.admin||!S.ready||!S.members.length)return;const o=summary(),s=JSON.stringify(o);if(s!=lastSum){lastSum=s;setDoc(doc(db,"summary","group"),{...o,updated:Date.now()}).catch(()=>{})}syncSheet()},3000);

// ---------- Google Sheet আয়না (ব্যাকআপ) ----------
const TL={pay:"মাসিক জমা",adv:"অগ্রিম জমা",due:"দেয় চাঁদা",baki:"বকেয়া",waiver:"ব্যক্তিগত মওকুফ",gwaiver:"গ্রুপ মওকুফ",extra:"অতিরিক্ত জমা",expense:"খরচ"};
function SHEETS(){const o=summary(),T={},byD=(a,b)=>(b.date||"")>(a.date||"")?1:-1,nm=id=>nameOf(id);
  T["সারাংশ"]={header:true,rows:[["বিষয়","টাকা / সংখ্যা"],["তহবিল ব্যালেন্স",o.balance],["মোট জমা (সর্বমোট)",o.totalIn],["মোট মাসিক চাঁদা (সর্বমোট)",o.monthly],["সদস্যদের অতিরিক্ত জমা",o.extraM],["বাইরের মানুষের অতিরিক্ত জমা",o.extraO],["মোট অতিরিক্ত তহবিল (সর্বমোট)",o.extra],["মোট খরচ (সর্বমোট)",o.totalOut],["এই মাসের মোট জমা",o.thisMonth],["মোট বকেয়া (সব সদস্য)",o.due],["সদস্য সংখ্যা",o.members]]};
  T["সদস্য"]={header:true,text:[1,4],rows:[["নাম","মোবাইল","যোগদান মাস","বর্তমান মাসিক হার","লগইন আইডি","মোট জমা","এখন পর্যন্ত দেয়","নেট ব্যালেন্স (+অগ্রিম/−বকেয়া)","অবস্থা","অগ্রিম জমা (ভবিষ্যৎ মাস)"],...S.members.map(m=>{const t=stat(m);return[m.name,m.phone||"",lab(m.join),rateAt(m,nowYM),m.loginId||"",t.pool,t.dueNow,t.net,t.label,t.adv]})]};
  T["জমা"]={header:true,rows:[["তারিখ","সদস্য","কোন মাসের চাঁদা","ধরন","টাকা","মাধ্যম","মন্তব্য"],...S.tx.filter(x=>x.kind=="pay").sort(byD).map(x=>[x.date||"",nm(x.memberId),lab(x.ym),x.ym>nowYM?"অগ্রিম":"মাসিক",x.amount,x.method||"",x.note||""])]};
  T["অতিরিক্ত জমা"]={header:true,rows:[["তারিখ","উৎস","নাম","উদ্দেশ্য","টাকা"],...S.common.filter(c=>c.kind=="extra").sort(byD).map(c=>[c.date||"",c.src=="member"?"গ্রুপ সদস্য":"বাইরের",c.name||"",c.title||"",c.amount])]};
  T["খরচ"]={header:true,rows:[["তারিখ","কে খরচ করেছেন","উদ্দেশ্য","টাকা"],...S.common.filter(c=>c.kind=="expense").sort(byD).map(c=>[c.date||"",c.name||"",c.title||"",c.amount])]};
  T["মওকুফ"]={header:true,rows:[["ধরন","সদস্য","মাস","টাকা"],...S.tx.filter(x=>x.kind=="waiver").map(x=>["ব্যক্তিগত",nm(x.memberId),lab(x.ym),x.amount]),...S.common.filter(c=>c.kind=="gwaiver").map(c=>["গ্রুপ (সবার)","সব সদস্য",lab(c.ym),""])]};
  T["মাসওয়ারি"]={header:true,rows:[["সদস্য","মাস","মাসিক হার","মওকুফ","দেয় চাঁদা","জমা","ব্যালেন্স (+অগ্রিম/−বকেয়া)"],...S.members.flatMap(m=>ledger(m).rows.map(r=>[m.name,lab(r.ym),rateAt(m,r.ym),r.gw?"গ্রুপের মাস মওকুফ":r.w>0?"ব্যক্তিগত মওকুফ "+r.w:"",r.due,r.paid,r.bal]))]};
  T["খতিয়ান"]={header:true,rows:[["হিসাবের মাস","তারিখ","সদস্য","ধরন","বিবরণ","জমা (+)","দেয় / বকেয়া / খরচ (−)"],...rows().sort(byD).map(r=>[r.ym?lab(r.ym):"",["pay","adv","extra","expense"].includes(r.k)?r.date:"",r.who?nm(r.who):(r.nm||"গ্রুপ"),TL[r.k]||r.k,r.txt,r.cr||r.wv||"",r.dr||""])]};
  return T}
let shHash="",shBusy=0,shLast=0;
const setSh=m=>{S.shMsg=m;const e=$("#shst");if(e)e.textContent=m};
async function syncSheet(force){
  if(!SHEET||!S.admin||!S.ready||!S.members.length||shBusy)return;
  const tables=SHEETS(),js=JSON.stringify({members:S.members,tx:S.tx,common:S.common}),h=JSON.stringify(tables)+js;
  if(!force&&(h==shHash||Date.now()-shLast<8000))return;
  shBusy=1;shLast=Date.now();setSh("⏳ Google Sheet-এ পাঠানো হচ্ছে…");
  try{const tok=await auth.currentUser.getIdToken(),r=await fetch(SHEET,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:tok,tables,json:js})}),j=await r.json();
    if(j.ok){shHash=h;setSh("✓ Google Sheet আপডেট হয়েছে: "+new Date().toLocaleTimeString("bn-BD"))}else{shLast=Date.now()+60000;setSh("✗ "+j.error)}}
  catch(e){shLast=Date.now()+60000;setSh("✗ পাঠানো যায়নি ("+(navigator.onLine?e.message:"ইন্টারনেট নেই")+")")}
  shBusy=0}
const sheetCard=()=>`<div class="card"><h3>📊 Google Sheet ব্যাকআপ</h3>${SHEET?`<p class="k" id="shst">${S.shMsg||"চালু আছে — ডেটা বদলালে নিজে থেকেই আপডেট হয়"}</p><button data-act="sheetnow">🔄 এখনই আপডেট করুন</button>`:'<p class="k">এখনও চালু হয়নি। config.js-এ sheetUrl বসাতে হবে।</p>'}</div>`;
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function mkLogin(m,id,pw){const sec=initializeApp(cfg,"sec"+Date.now()),sa=getAuth(sec);
  try{const c=await createUserWithEmailAndPassword(sa,email(id),pw);if(m.uid)deleteDoc(doc(db,"users",m.uid));
    await setDoc(doc(db,"users",c.user.uid),{memberId:m.id,loginId:id});await setDoc(doc(db,"members",m.id),{...m,loginId:id,uid:c.user.uid});await signOut(sa)}finally{deleteApp(sec)}}
async function importData(d){const it=[];(d.members||[]).forEach(m=>{const o={...m};delete o.pw;delete o.loginId;delete o.uid;it.push(["members",o])});(d.tx||[]).forEach(x=>it.push(["tx",x]));(d.common||[]).forEach(x=>it.push(["common",x]));
  for(let i=0;i<it.length;i+=400){const b=writeBatch(db);it.slice(i,i+400).forEach(([c,o])=>b.set(doc(db,c,o.id),o));await b.commit()}toast("ইমপোর্ট সম্পন্ন ("+it.length+" টি)")}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();S.inst=e;render()});setInterval(()=>{const y=ymOf(new Date());if(y!=nowYM){nowYM=y;today=dayOf(new Date());render()}},60000);window.addEventListener("online",render);window.addEventListener("offline",render);
// ---------- views ----------

    else if(d.ec){S.ec=d.ec;S.cd=null;S.tab="com";render();scrollTo(0,0)}
    else if(d.ew){S.ew=d.ew;S.tab="wv";render();scrollTo(0,0)}
    else if(d.eg){S.eg=d.eg;S.tab="wv";render();scrollTo(0,0)}
    else if(d.emem){S.emem=d.emem;S.viewM=null;render();scrollTo(0,0)}
    else if(d.delrate){const m=S.members.find(x=>x.id==S.emem);put("members",{...m,changes:m.changes.filter((c,i)=>i!=+d.delrate)})}
    else if(d.view){S.viewM=d.view;render()}
    else if(d.rate){const m=S.members.find(x=>x.id==d.rate),y=prompt("কোন মাস থেকে নতুন হার? (YYYY-MM, যেমন 2027-01)",nowYM),r=y&&prompt("নতুন মাসিক চাঁদা (টাকা)");if(y&&r)put("members",{...m,changes:[...(m.changes||[]),{from:y,rate:+r}]})}
    else if(d.login){const m=S.members.find(x=>x.id==d.login),i=clean(prompt("লগইন আইডি (ইংরেজি/সংখ্যা)")||""),p=i&&prompt("পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)");
      if(i&&p&&p.length>=6){if(S.members.some(x=>x.loginId==i&&x.id!=m.id))return alert("এই আইডি আগে নেওয়া");await mkLogin(m,i,p);toast("লগইন তৈরি: "+i)}else if(i)alert("পাসওয়ার্ড কমপক্ষে ৬ অক্ষর")}
  }catch(err){alert(err.message)}});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.dataset&&t.dataset.cf){S.cd={k:v("ck"),s:v("cs"),d:v("cd"),n:v("cn")||"",t:v("ct"),a:v("ca")};render();return}
  if(t.dataset&&t.dataset.asm){S.asMember=t.value;localStorage.adminMember=t.value;S.tab="home";render();return}
  if(t.dataset&&t.dataset.f){S.fl[t.dataset.f]=t.value;render();return}
  if(t.id=="fi"&&t.files[0]){try{const d=JSON.parse(await t.files[0].text());t.value="";if(!d.members||!confirm("এই ফাইলের ডেটা অনলাইনে লোড হবে। নিশ্চিত?"))return;await importData(d)}catch(x){alert("ফাইলটি সঠিক নয়: "+x.message)}}});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&!S.user)A.login()});
if("serviceWorker"in navigator&&!window.Capacitor){navigator.serviceWorker.register("sw.js");let r;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(r)return;r=1;if(sessionStorage.sw)location.reload();sessionStorage.sw=1})}
render();startAuth();window.__ok=true;
