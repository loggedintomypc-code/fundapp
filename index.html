<div id="app"><p style="text-align:center;padding:40px">⏳ লোড হচ্ছে…</p></div><input type="file" id="fi" hidden><div id="toast"></div>
<script type="module">
import{initializeApp,deleteApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword,updatePassword,reauthenticateWithCredential,EmailAuthProvider}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{initializeFirestore,persistentLocalCache,collection,doc,getDoc,setDoc,deleteDoc,onSnapshot,query,where,writeBatch}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import*as C from"./config.js";const cfg=C.cfg; // Firebase সেটিং config.js ফাইলে থাকে
const ADMINS=C.admins||["mamun@fund.app"],SHEET=C.sheetUrl||"";
const app=initializeApp(cfg),auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache()});
const MN=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
const $=s=>document.querySelector(s),f=n=>Number(n||0).toLocaleString("bn-BD"),sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const ymOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),dayOf=d=>ymOf(d)+"-"+String(d.getDate()).padStart(2,"0");let nowYM=ymOf(new Date()),today=dayOf(new Date());
const lab=y=>MN[+y.slice(5)-1]+" "+(+y.slice(0,4)).toLocaleString("bn-BD",{useGrouping:false});
const nx=y=>{let[a,b]=y.split("-").map(Number);b++;if(b>12){b=1;a++}return a+"-"+String(b).padStart(2,"0")};
const S={user:null,admin:false,members:[],tx:[],common:[],sum:null,tab:"home",err:"",ready:false,fl:{m:"",y:nowYM.slice(0,4),mo:"",t:"",q:""}};

const rateAt=(m,y)=>{let r=m.rate0;[...(m.changes||[])].sort((a,b)=>a.from<b.from?-1:1).forEach(c=>{if(c.from<=y)r=c.rate});return r};
function ledger(m){
  const pays=S.tx.filter(t=>t.kind=="pay"&&t.memberId==m.id),wv=S.tx.filter(t=>t.kind=="waiver"&&t.memberId==m.id),gw=new Set(S.common.filter(c=>c.kind=="gwaiver").map(c=>c.ym));
  let last=nowYM;pays.forEach(p=>{if(p.ym>last)last=p.ym});
  let bal=sum(pays.filter(p=>p.ym<m.join),"amount");const rows=[];
  for(let y=m.join;y<=last;y=nx(y)){
    const w=sum(wv.filter(x=>x.ym==y),"amount"),due=gw.has(y)?0:Math.max(0,rateAt(m,y)-w),paid=sum(pays.filter(p=>p.ym==y),"amount");
    bal+=paid-due;rows.push({ym:y,due,paid,bal,w,gw:gw.has(y)})}
  return{rows,bal}}

// ---------- online data (Firebase) ----------
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),clean=s=>(s||"").trim().toLowerCase().replace(/[^a-z0-9_.-]/g,""),email=i=>i+"@fund.app";
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800)};
const put=(c,o)=>{setDoc(doc(db,c,o.id),o).catch(e=>alert("সংরক্ষণ হয়নি: "+e.message));toast("✓ সংরক্ষিত")};
const rm=(c,id)=>{deleteDoc(doc(db,c,id)).catch(e=>alert(e.message));toast("মোছা হয়েছে")};
let unsub=[];const clear=()=>{unsub.forEach(u=>u());unsub=[]};
const watch=(q_,key)=>unsub.push(onSnapshot(q_,s=>{S[key]=s.docs.map(d=>({id:d.id,...d.data()}));if(key=="members")S.ready=true;render()},e=>{S.err=e.message;render()}));
const startAuth=()=>onAuthStateChanged(auth,async u=>{
  clear();S.user=u;S.err="";S.ready=false;S.members=[];S.tx=[];S.common=[];S.sum=null;S.tab="home";S.fl={m:"",y:nowYM.slice(0,4),mo:"",t:"",q:""};if(!u){render();return}
  S.admin=ADMINS.includes(u.email);
  if(S.admin){watch(collection(db,"members"),"members");watch(collection(db,"tx"),"tx");watch(collection(db,"common"),"common")}
  else{try{const ud=await getDoc(doc(db,"users",u.uid));if(!ud.exists()){S.err="এই আইডি কোনো সদস্যের সাথে যুক্ত নয়";S.ready=true;render();return}
    const mid=ud.data().memberId;
    unsub.push(onSnapshot(doc(db,"members",mid),d=>{S.members=[{id:d.id,...d.data()}];S.ready=true;render()},e=>{S.err=e.message;render()}));
    watch(query(collection(db,"tx"),where("memberId","==",mid)),"tx");
    let cA=[],cB=[];const mc=()=>{S.common=[...cA,...cB];render()},er=e=>{S.err=e.message;render()},mp=s=>s.docs.map(d=>({id:d.id,...d.data()}));
    unsub.push(onSnapshot(query(collection(db,"common"),where("kind","==","gwaiver")),s=>{cA=mp(s);mc()},er));
    unsub.push(onSnapshot(query(collection(db,"common"),where("memberId","==",mid)),s=>{cB=mp(s);mc()},er));
    unsub.push(onSnapshot(doc(db,"summary","group"),d=>{S.sum=d.data();render()}))}catch(e){S.err="লোড হয়নি — ইন্টারনেট চেক করুন";S.ready=true;render()}}
  render()});
function stat(m){const L=ledger(m),pays=S.tx.filter(t=>t.kind=="pay"&&t.memberId==m.id),pool=sum(pays,"amount"),dueNow=sum(L.rows.filter(r=>r.ym<=nowYM),"due"),net=pool-dueNow;
  return{net,pool,dueNow,adv:sum(pays.filter(p=>p.ym>nowYM),"amount"),label:net<0?"বকেয়া":net>0?"অগ্রিম":"পরিষ্কার"}}
function summary(){
  const pays=S.tx.filter(t=>t.kind=="pay"),pay=sum(pays,"amount"),exs=S.common.filter(c=>c.kind=="extra"),ex=sum(exs,"amount"),exO=sum(exs.filter(c=>c.src=="outsider"),"amount"),out=sum(S.common.filter(c=>c.kind=="expense"),"amount");
  const act=S.members.filter(m=>rateAt(m,nowYM)>0),ina=S.members.filter(m=>rateAt(m,nowYM)<=0),pm=ms=>sum(pays.filter(p=>ms.some(m=>m.id==p.memberId)),"amount");
  return{active:act.length,inactive:ina.length,payActive:pm(act),payInactive:pm(ina),balance:pay+ex-out,totalIn:pay+ex,totalOut:out,monthly:pay,extra:ex,extraO:exO,extraM:ex-exO,members:S.members.length,thisMonth:sum(pays.filter(p=>p.ym==nowYM),"amount"),due:S.members.reduce((a,m)=>a+Math.max(0,-stat(m).net),0)}}
let lastSum="";setInterval(()=>{if(!S.admin||!S.ready||!S.members.length)return;const o=summary(),s=JSON.stringify(o);if(s!=lastSum){lastSum=s;setDoc(doc(db,"summary","group"),{...o,updated:Date.now()}).catch(()=>{})}syTick()},3000);

// ---------- Google Sheet দ্বিমুখী সিঙ্ক (আপনার মূল ফাইলের ইনপুট ঘরের সাথে) ----------
const N_=s=>String(s??"").normalize("NFC").trim().replace(/\s+/g," "),ph_=p=>{let d=String(p??"").replace(/\D/g,"");if(d.length==10&&d[0]=="1")d="0"+d;return d};
const KEYLEN={members:1,pays:3,waivers:2,gw:1,extras:4,expenses:3},TN={members:"সদস্য",pays:"জমা",waivers:"ব্যক্তিগত মওকুফ",gw:"গ্রুপ মওকুফ",extras:"অতিরিক্ত জমা",expenses:"খরচ"};
const srt=a=>a.sort((x,y)=>{const p=JSON.stringify(x),q=JSON.stringify(y);return p<q?-1:p>q?1:0});
const hsh=o=>{const s=JSON.stringify(o);let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h+":"+s.length};
const parseCh=s=>s?s.split("|").map(x=>{const[f,r]=x.split(":");return{from:f,rate:+r}}):[];
function canonApp(){
  const it={members:[],pays:[],waivers:[],gw:[],extras:[],expenses:[]},nm=id=>N_(nameOf(id)),add=(t,row,doc,col)=>it[t].push({row,doc,col});
  S.members.forEach(m=>add("members",[N_(m.name),ph_(m.phone),m.join,+m.rate0,(m.changes||[]).slice().sort((a,b)=>a.from<b.from?-1:1).map(c=>c.from+":"+(+c.rate)).join("|")],m,"members"));
  S.tx.forEach(x=>{if(x.kind=="pay")add("pays",[nm(x.memberId),x.ym,+x.amount,x.date||x.ym+"-01",N_(x.method),N_(x.note)],x,"tx");else if(x.kind=="waiver")add("waivers",[nm(x.memberId),x.ym,+x.amount],x,"tx")});
  S.common.forEach(c=>{if(c.kind=="gwaiver")add("gw",[c.ym,N_(c.title)],c,"common");
    else if(c.kind=="extra")add("extras",[c.date||"",c.src=="member"?"member":"outsider",N_(c.name),+c.amount,N_(c.title)],c,"common");
    else if(c.kind=="expense")add("expenses",[c.date||"",N_(c.name),+c.amount,N_(c.title)],c,"common")});
  return it}
const rowsOf=it=>{const o={};for(const t in it)o[t]=srt(it[t].map(x=>x.row));return o};
function diffT(t,appItems,sheetRows){const k=KEYLEN[t],ks=r=>JSON.stringify(r.slice(0,k)),R={add:[],del:[],upd:[]},A={},X={};
  appItems.forEach(i=>(A[ks(i.row)]=A[ks(i.row)]||[]).push(i));sheetRows.forEach(r=>(X[ks(r)]=X[ks(r)]||[]).push(r));
  new Set([...Object.keys(A),...Object.keys(X)]).forEach(key=>{const a=(A[key]||[]).slice(),s=(X[key]||[]).slice();
    for(let i=s.length-1;i>=0;i--){const j=a.findIndex(x=>JSON.stringify(x.row)==JSON.stringify(s[i]));if(j>=0){a.splice(j,1);s.splice(i,1)}}
    const n=Math.min(a.length,s.length);for(let i=0;i<n;i++)R.upd.push({it:a[i],to:s[i]});
    a.slice(n).forEach(i=>R.del.push(i));s.slice(n).forEach(r=>R.add.push(r))});
  return R}
function diffAll(it,sheet){const d={},cnt={add:0,del:0,upd:0},parts=[];
  for(const t in KEYLEN){d[t]=diffT(t,it[t],sheet[t]||[]);const x=d[t];cnt.add+=x.add.length;cnt.del+=x.del.length;cnt.upd+=x.upd.length;
    if(x.add.length+x.del.length+x.upd.length)parts.push(`${TN[t]}: +${x.add.length} −${x.del.length} ~${x.upd.length}`)}
  return{d,cnt,txt:parts.join(" • ")}}
async function applyPull(sheet){
  const it=canonApp(),{d}=diffAll(it,sheet),ops=[],warn=[],nameId={};S.members.forEach(m=>nameId[N_(m.name)]=m.id);
  const set=(c,o)=>ops.push(["set",c,JSON.parse(JSON.stringify(o))]),del=(c,id)=>ops.push(["del",c,id]);
  d.members.add.forEach(r=>{const id=uid();nameId[r[0]]=id;set("members",{id,name:r[0],phone:r[1],join:r[2],rate0:r[3],changes:parseCh(r[4])})});
  d.members.upd.forEach(({it:i,to})=>set("members",{...i.doc,phone:to[1],join:to[2],rate0:to[3],changes:parseCh(to[4])}));
  d.members.del.forEach(({doc:m})=>{S.tx.filter(x=>x.memberId==m.id).forEach(x=>del("tx",x.id));if(m.uid)del("users",m.uid);del("members",m.id);delete nameId[N_(m.name)]});
  d.pays.add.forEach(r=>{const mid=nameId[r[0]];if(!mid){warn.push(r[0]);return}set("tx",{id:uid(),kind:"pay",memberId:mid,ym:r[1],amount:r[2],date:r[3],method:r[4],note:r[5]})});
  d.pays.upd.forEach(({it:i,to})=>set("tx",{...i.doc,date:to[3],method:to[4],note:to[5]}));
  d.waivers.add.forEach(r=>{const mid=nameId[r[0]];if(!mid){warn.push(r[0]);return}set("tx",{id:uid(),kind:"waiver",memberId:mid,ym:r[1],amount:r[2]})});
  d.waivers.upd.forEach(({it:i,to})=>set("tx",{...i.doc,amount:to[2]}));
  d.gw.add.forEach(r=>set("common",{id:uid(),kind:"gwaiver",ym:r[0],title:r[1]}));
  d.gw.upd.forEach(({it:i,to})=>set("common",{...i.doc,title:to[1]}));
  d.extras.add.forEach(r=>set("common",{id:uid(),kind:"extra",date:r[0],src:r[1],name:r[2],amount:r[3],title:r[4],...(r[1]=="member"&&nameId[r[2]]?{memberId:nameId[r[2]]}:{})}));
  d.extras.upd.forEach(({it:i,to})=>set("common",{...i.doc,title:to[4]}));
  d.expenses.add.forEach(r=>set("common",{id:uid(),kind:"expense",date:r[0],name:r[1],amount:r[2],title:r[3],...(nameId[r[1]]?{memberId:nameId[r[1]]}:{})}));
  d.expenses.upd.forEach(({it:i,to})=>set("common",{...i.doc,title:to[3]}));
  ["pays","waivers","gw","extras","expenses"].forEach(t=>d[t].del.forEach(({doc:x,col})=>del(col,x.id)));
  for(let i=0;i<ops.length;i+=400){const b=writeBatch(db);ops.slice(i,i+400).forEach(([k,c,o])=>k=="set"?b.set(doc(db,c,o.id),o):b.delete(doc(db,c,o)));await b.commit()}
  return{n:ops.length,warn}}
let syBusy=0,syLast=0,syHA="",syChg=0;
const setSh=m=>{S.shMsg=m;const e=$("#shst");if(e)e.textContent=m},autoPull=()=>localStorage.autoPull!="0";
async function callSheet(body){const tok=await auth.currentUser.getIdToken(),r=await fetch(SHEET,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:tok,...body})}),j=await r.json();if(!j.ok)throw new Error(j.error||"অজানা সমস্যা");return j}
async function doPush(A,hA){const j=await callSheet({action:"write",tables:A,json:JSON.stringify({members:S.members,tx:S.tx,common:S.common})});
  await callSheet({action:"state",state:{app:hA,sheet:hsh(j.sheet)}});S.sy=null;
  setSh("✓ অ্যাপ → Sheet হয়েছে: "+new Date().toLocaleTimeString("bn-BD")+(j.changedRows?` (${j.changedRows} সারি বদলেছে)`:" (বদল ছিল না)")+(j.warn&&j.warn.length?" ⚠️ "+j.warn.join("; "):""))}
async function applyPending(askDel){const y=S.sy;if(!y)return;
  if(y.cnt.del>0&&askDel&&!confirm(`Sheet-এর সাথে মেলাতে অ্যাপ থেকে ${y.cnt.del}টি এন্ট্রি মুছবে (বদলও এর মধ্যে ধরা)।\n${y.txt}\nনিশ্চিত?`))return;
  setSh("⏳ Sheet থেকে অ্যাপে নেওয়া হচ্ছে…");const r=await applyPull(y.sheet);

async function shotTable(tbl,title,sub){

  g.fillStyle="#64748b";g.font="12px "+FN;g.textBaseline="alphabetic";g.fillText("গ্রুপ তহবিল • তৈরি: "+new Date().toLocaleString("bn-BD"),P,H-10);
