name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install tools
        run: npm install && npm install firebase@10.12.2 esbuild
      - name: Bundle web app (Firebase inside the app, works offline)
        run: |
          cat > bundle.cjs <<'EOF'
          const fs=require('fs');
          let h=fs.readFileSync('index.html','utf8');
          const m=h.match(/<script type="module">([\s\S]*)<\/script>/);
          if(!m)throw new Error('module script not found');
          const js=m[1].replace(/https:\/\/www\.gstatic\.com\/firebasejs\/[\d.]+\/firebase-(app|auth|firestore)\.js/g,(a,b)=>'firebase/'+b);
          fs.mkdirSync('src',{recursive:true});fs.mkdirSync('www',{recursive:true});
          fs.writeFileSync('src/app.js',js);fs.copyFileSync('config.js','src/config.js');
          fs.writeFileSync('www/index.html',h.replace(m[0],()=>'<script src="app.js"></script>'));
          EOF
          node bundle.cjs
          npx esbuild src/app.js --bundle --minify --format=iife --target=chrome80 --outfile=www/app.js
          cp manifest.json icon-192.png icon-512.png www/
          cp -r fonts www/
          if grep -q "www.gstatic.com" www/app.js; then echo "Firebase was not bundled"; exit 1; fi
          ls -la www
      - name: Create Android project
        run: npx cap add android
      - name: App icon and launch screen
        continue-on-error: true
        run: |
          pip install pillow
          python3 - <<'PY'
          import glob,os
          from PIL import Image,ImageDraw
          src=Image.open("icon-512.png").convert("RGBA")
          for f in glob.glob("android/app/src/main/res/mipmap-*/ic_launcher*.png"):
              n=os.path.basename(f)
              sz=Image.open(f).size[0]
              if "foreground" in n:
                  im=Image.new("RGBA",(sz,sz),(255,255,255,255)); k=int(sz*0.70)
                  im.paste(src.resize((k,k)),((sz-k)//2,(sz-k)//2))
              else:
                  im=src.resize((sz,sz)).convert("RGBA")
                  if "round" in n:
                      m=Image.new("L",(sz,sz),0); ImageDraw.Draw(m).ellipse((0,0,sz-1,sz-1),fill=255)
                      im.putalpha(m)
              im.save(f)
          for f in glob.glob("android/app/src/main/res/drawable*/splash*.png"):
              w,h=Image.open(f).size
              bg=Image.new("RGBA",(w,h),(255,255,255,255)); k=int(min(w,h)*0.5)
              bg.paste(src.resize((k,k)),((w-k)//2,(h-k)//2))
              bg.save(f)
          PY
      - name: Build
        run: |
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GroupFund.apk
      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Group Fund APK ${{ github.run_number }}
          files: GroupFund.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GroupFund-APK
          path: GroupFund.apk
